id = "local.worktree-from-main"
name = "Worktree from main"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Create a worktree from the repo's main branch, from any workspace in the repo (including linked worktrees)"
platforms = ["linux", "macos"]

[[actions]]
id = "new"
title = "New worktree from main"
contexts = ["workspace"]
command = ["bash", "action.sh"]

[[panes]]
id = "prompt"
title = "New worktree from main"
placement = "popup"
width = 64
height = 8
command = ["bash", "prompt.sh"]

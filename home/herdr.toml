onboarding = false

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

# fx sets its terminal title to the generated session title (same as /resume).
# `fx` isn't a canonical agent id, so rows_by_agent can't target it; set the default rows.
# [ui.sidebar.agents]
# rows = [
# ]

[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "terminal_title_stripped", fg = "#a6aac8" }],
    [{ token = "workspace", fg = "#6b7088", bold = false }, { token = "tab", fg = "#6b7088", bold = false }],
    ["$gh_pr", "$gh_review", { token = "$gh_failed", fg = "#ff6b6b" }, { token = "$gh_pending", fg = "#c4b28a" }, { token = "$gh_passed", fg = "#8a9a7b" }, { token = "$gh_canceled", fg = "#c0c0c0" }, { token = "$gh_skipped", fg = "#c0c0c0" }, { token = "$gh_unknown", fg = "#c0c0c0" }],
]
# rows = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[keys]
# Hyper+F (Caps Lock held via Karabiner = ctrl+alt+shift+cmd)
prefix = "ctrl+alt+shift+cmd+f"
previous_workspace = "ctrl+alt+shift+cmd+["
next_workspace = "ctrl+alt+shift+cmd+]"
# Prefix, then Shift+G: built-in new worktree (only works from the repo's parent row).
# Prefix, then Hyper+W is bound under [[keys.command]] to the worktree-from-main plugin.
new_worktree = "prefix+shift+g"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# Pane movement is alt+hjkl everywhere (needs Option-as-Alt in the terminal)
navigate_pane_left = "alt+h"
navigate_pane_down = "alt+j"
navigate_pane_up = "alt+k"
navigate_pane_right = "alt+l"
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

[ui.sound]
enabled = false

# Match worktrunk (worktree-path = "../worktrees/{{ repo }}/..." from ~/vercel/<repo>)
[worktrees]
directory = "~/vercel/worktrees"

# Prefix, then Hyper+W: new worktree from the repo's main branch, from any workspace in the repo
# (including linked worktrees). Plugin source: home/herdr-plugins/worktree-from-main
[[keys.command]]
key = "prefix+ctrl+alt+shift+cmd+w"
type = "plugin_action"
command = "local.worktree-from-main.new"
description = "new worktree from main"

# Prefix, then F: search fx sessions with fz. Focuses an open session's pane, or resumes a
# closed one in a new workspace. Plugin source: ~/dev/fz/herdr-plugin
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "local.fz.search"
description = "search fx sessions"

[theme]
name = "catppuccin"
auto_switch = false

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "gh.menu"
description = "GitHub - open menu"

[[keys.command]]
key = "prefix+alt+o"
type = "plugin_action"
command = "gh.open"
description = "GitHub - open or create PR"

[[keys.command]]
key = "prefix+alt+a"
type = "plugin_action"
command = "gh.refresh"
description = "GitHub - Force refresh"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "gh.open-checks"
description = "GitHub - View Checks"

[[keys.command]]
key = "prefix+alt+s"
type = "plugin_action"
command = "gh.copy-slack"
description = "GitHub - copy PR for Slack"
